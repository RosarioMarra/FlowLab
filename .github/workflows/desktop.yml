name: App desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: flowlab-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacchetti
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: FlowLab ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: pacchetti/*
          body: |
            **Windows**: scarica `FlowLab-Setup-Windows.exe` (installazione) oppure `FlowLab-Portable-Windows.exe` (senza installazione).
            **macOS**: scarica `FlowLab-macOS.dmg` (Mac con chip Apple e Intel).
